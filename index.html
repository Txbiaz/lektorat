<!--
  Lektorat-Seite für zwei Schreiber.

  Diese Seite enthält keine Texte. Nach der Anmeldung mit einem GitHub-Token liest und schreibt sie
  direkt im privaten Repo (Branch "lektorat"):
    <story>/index.json          Titel, Autor, Kapitel mit Versionen und Stand
    <story>/chNN/vK.md          Version K eines Kapitels
    <story>/chNN/comments.json  Kommentare und Antworten
  Claude liest und beantwortet die Kommentare mit tools/lektorat.py im selben Repo.
  Quelltext: tools/lektorat_site/index.html auf main; veröffentlicht mit "tools/lektorat.py publish-site".
-->
<style>
:root {
  --bg: #f7f5f0; --surface: #fffefb; --surface-2: #f0ede6; --line: #e2ddd3; --line-strong: #cfc8bb;
  --ink: #1f1c18; --ink-2: #5a544b; --ink-3: #8a8378;
  --accent: #3552c9; --accent-ink: #ffffff; --accent-soft: #e6eafb;
  --hl: rgba(255, 190, 40, .38); --hl-active: rgba(255, 140, 0, .55); --hl-done: rgba(120, 120, 120, .18);
  --pick: rgba(53, 82, 201, .22); --changed: #e0a400;
  --st-eingereicht: #2f6fd6; --st-in-arbeit: #b7791f; --st-kommentiert: #7a4fcf; --st-ueberarbeitet: #0f8a80; --st-erledigt: #2f8a3a;
  --danger: #c0392b; --shadow: 0 1px 2px rgba(30, 25, 15, .06), 0 6px 24px rgba(30, 25, 15, .07);
  --series: #2a78d6; --good: #006300; --bad: #d03b3b; --stat-icon: #0ca30c;
  --text-font: "Literata", Georgia, "Times New Roman", serif;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --surface: #1e1d1b; --surface-2: #272522; --line: #34312d; --line-strong: #46423c;
    --ink: #ece8e1; --ink-2: #b4ada3; --ink-3: #857e74;
    --accent: #7d95f2; --accent-ink: #10131f; --accent-soft: #252c47;
    --hl: rgba(255, 190, 40, .26); --hl-active: rgba(255, 150, 20, .45); --hl-done: rgba(200, 200, 200, .12);
    --pick: rgba(125, 149, 242, .28); --changed: #d9a520;
    --st-eingereicht: #6d9cf0; --st-in-arbeit: #e0a64a; --st-kommentiert: #ab8cf0; --st-ueberarbeitet: #3fbfb3; --st-erledigt: #5cbf68;
    --series: #3987e5; --good: #0ca30c; --bad: #e66767;
    --danger: #ef7a6d; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --surface: #1e1d1b; --surface-2: #272522; --line: #34312d; --line-strong: #46423c;
  --ink: #ece8e1; --ink-2: #b4ada3; --ink-3: #857e74;
  --accent: #7d95f2; --accent-ink: #10131f; --accent-soft: #252c47;
  --hl: rgba(255, 190, 40, .26); --hl-active: rgba(255, 150, 20, .45); --hl-done: rgba(200, 200, 200, .12);
  --pick: rgba(125, 149, 242, .28); --changed: #d9a520;
  --st-eingereicht: #6d9cf0; --st-in-arbeit: #e0a64a; --st-kommentiert: #ab8cf0; --st-ueberarbeitet: #3fbfb3; --st-erledigt: #5cbf68;
  --series: #3987e5; --good: #0ca30c; --bad: #e66767;
    --danger: #ef7a6d; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui-font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
.brand i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-style: normal; font-weight: 700; font-size: 14px; }
.bar .spacer { flex: 1; }
.apptabs { display: flex; gap: 4px; height: 100%; }
.apptab { display: flex; align-items: center; gap: 9px; padding: 0 10px; color: var(--ink-2); text-decoration: none; font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.apptab:hover { color: var(--ink); }
.apptab.on { color: var(--ink); border-bottom-color: var(--ink); }
.apptab i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  font-style: normal; font-weight: 700; font-size: 14px; }
.apptab i.green { background: var(--stat-icon); color: #fff; }
.apptab i svg { width: 17px; height: 17px; }
.me { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.me img { width: 26px; height: 26px; border-radius: 50%; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 9px; padding: 6px 12px; font-size: 14px; line-height: 20px; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.small { padding: 3px 9px; font-size: 13px; border-radius: 7px; }
.btn.danger { color: var(--danger); }
.icon { width: 16px; height: 16px; flex: none; }

/* login */
.login { max-width: 560px; margin: 56px auto; padding: 0 16px; }
.login h1 { font: 600 30px/1.2 var(--text-font); margin: 0 0 8px; letter-spacing: -.01em; }
.login .lead { color: var(--ink-2); margin: 0 0 24px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.login label { display: block; font-weight: 600; margin-bottom: 6px; }
.login input { width: 100%; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 9px; padding: 9px 11px; }
.login input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.login .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
.login .err { color: var(--danger); font-size: 14px; }
.login details { margin-top: 18px; color: var(--ink-2); }
.login summary { cursor: pointer; color: var(--ink); font-weight: 600; }
.login ol { padding-left: 20px; margin: 10px 0; }
.login li { margin: 6px 0; }
.login code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.note { font-size: 13px; color: var(--ink-3); margin-top: 14px; }

/* overview */
.page { padding: 28px 0 80px; }
.page h1 { font: 600 28px/1.2 var(--text-font); margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--ink-2); margin: 0 0 24px; }
.foryou { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 32px; }
.foryou h2, .story h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 10px; font-weight: 650; }
.foryou .panel { padding: 16px 18px; }
.foryou ul { list-style: none; margin: 0; padding: 0; }
.foryou li + li { border-top: 1px solid var(--line); }
.foryou a.item { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; text-decoration: none; color: var(--ink); }
.foryou a.item:hover .t { color: var(--accent); }
.foryou .t { flex: 1; min-width: 0; }
.foryou .t small { display: block; color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; }
.story { margin-bottom: 36px; }
.story-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
.story-head h3 { font: 600 22px/1.25 var(--text-font); margin: 0; }
.story-head .meta { color: var(--ink-2); font-size: 14px; }
.chapters { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.chap { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center;
  padding: 11px 16px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.chap:first-child { border-top: 0; }
.chap:hover { background: var(--surface-2); }
.chap .n { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 14px; }
.chap .t { min-width: 0; }
.chap .t b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chap .t small { color: var(--ink-3); font-size: 13px; }
.count { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 38px; }
.count.has { color: var(--ink); font-weight: 600; }
.wn { font-size: 12px; color: var(--ink-3); min-width: 64px; text-align: right; white-space: nowrap; }
.wn.same { color: var(--st-erledigt); }
.wn.old { color: var(--st-in-arbeit); }
.wn.diff { color: var(--danger); }
.worktabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 0 22px; scrollbar-width: thin; }
.wtab { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink-2); text-decoration: none; font-size: 14px; white-space: nowrap; }
.wtab:hover { color: var(--ink); border-color: var(--ink-3); }
.wtab.on { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.wtab .n { font-size: 11.5px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; line-height: 17px; }
.wtab.add { border-style: dashed; }
.story-head .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.story-head .tools a { font-size: 14px; }
dialog.dlg { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--surface); color: var(--ink);
  width: min(480px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog.dlg::backdrop { background: rgba(0, 0, 0, .4); }
.dlg h2 { font: 600 21px/1.3 var(--text-font); margin: 0 0 6px; }
.dlg label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 0; }
.dlg label small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
.dlg input { display: block; width: 100%; margin-top: 5px; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 9px; padding: 8px 10px; font-weight: 400; }
.dlg input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.dlg input[type="number"] { width: 96px; }
.dlg .err { color: var(--danger); font-size: 14px; min-height: 1.3em; margin-top: 12px; }
.dlg code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px 2px 8px; border-radius: 999px;
  color: var(--c, var(--ink-2)); background: color-mix(in srgb, var(--c, var(--ink-3)) 13%, transparent); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill[data-s="eingereicht"] { --c: var(--st-eingereicht); }
.pill[data-s="in-arbeit"] { --c: var(--st-in-arbeit); }
.pill[data-s="kommentiert"] { --c: var(--st-kommentiert); }
.pill[data-s="ueberarbeitet"] { --c: var(--st-ueberarbeitet); }
.pill[data-s="erledigt"] { --c: var(--st-erledigt); }

/* reader */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 60px; padding: 24px 0 120px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--accent); }
.rhead h1 { font: 600 30px/1.2 var(--text-font); margin: 8px 0 10px; letter-spacing: -.01em; }
.rmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--ink-2); font-size: 14px; }
.rmeta select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 14px; }
.ractions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.vnote { margin: 12px 0 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 14px; color: var(--ink-2); }
.hint { margin: 18px 0 0; font-size: 13px; color: var(--ink-3); }
.text { max-width: var(--read-width, 690px); margin-top: 26px; font: var(--read-size, 18.5px)/1.72 var(--text-font); position: relative; }
.text .b { position: relative; margin: 0 0 1em; border-radius: 4px; }
.text h2.b, .text h3.b { font: 600 22px/1.3 var(--text-font); margin: 1.4em 0 .8em; }
.text blockquote.b { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--line-strong); color: var(--ink-2); }
.text hr.b { border: 0; text-align: center; margin: 1.6em 0; }
.text hr.b::after { content: "* * *"; color: var(--ink-3); letter-spacing: .4em; }
.text .b.changed::before { content: ""; position: absolute; left: -14px; top: .25em; bottom: .25em; width: 3px; border-radius: 2px; background: var(--changed); }
.bubble { position: absolute; right: -42px; top: 2px; min-width: 28px; height: 24px; padding: 0 7px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--surface); font: 600 12px/22px var(--ui-font); color: var(--ink-2); }
.bubble:hover, .bubble.on { border-color: var(--accent); color: var(--accent); }
::highlight(cmt) { background-color: var(--hl); }
::highlight(cmt-done) { background-color: var(--hl-done); }
::highlight(cmt-active) { background-color: var(--hl-active); }
::highlight(pick) { background-color: var(--pick); }
.fab { position: absolute; z-index: 15; transform: translate(-50%, 8px); box-shadow: var(--shadow); }

/* side panel */
.side { position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 88px); display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.side-head h2 { font-size: 15px; margin: 0; flex: 1; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; }
.tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
.side-close { display: none; }
.cards { overflow-y: auto; padding: 2px 4px 20px 2px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.done { opacity: .72; }
.card header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--ink-3); font-size: 12.5px; }
.card header b { color: var(--ink); font-size: 13px; }
.kind { font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.kind[data-k="Fehler"] { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.kind[data-k="Lob"] { color: var(--st-erledigt); background: color-mix(in srgb, var(--st-erledigt) 13%, transparent); }
.kind[data-k="Logik"] { color: var(--st-kommentiert); background: color-mix(in srgb, var(--st-kommentiert) 13%, transparent); }
.kind[data-k="Stil"] { color: var(--st-eingereicht); background: color-mix(in srgb, var(--st-eingereicht) 13%, transparent); }
.card .q { margin: 8px 0 6px; padding: 2px 0 2px 10px; border-left: 3px solid var(--hl-active); color: var(--ink-2); font: italic 14px/1.5 var(--text-font);
  cursor: pointer; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .q.lost { border-left-color: var(--line-strong); cursor: default; }
.card p { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.sugg { margin: 8px 0; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font: 14px/1.5 var(--text-font); }
.sugg small { display: block; font: 600 11.5px var(--ui-font); color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.sugg del { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); text-decoration-thickness: 1px; border-radius: 3px; }
.sugg ins { color: var(--st-erledigt); background: color-mix(in srgb, var(--st-erledigt) 14%, transparent); text-decoration: none; border-radius: 3px; }
.replies { list-style: none; margin: 8px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); }
.replies li { margin: 6px 0; }
.replies li header { font-size: 12px; }
.replies p { margin: 2px 0; }
.card footer { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.accepted { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--ui-font); color: var(--st-erledigt);
  background: color-mix(in srgb, var(--st-erledigt) 13%, transparent); border-radius: 6px; padding: 1px 7px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
.edited { font-style: italic; }
.card form.editform .chips { margin-top: 2px; }
.readset { position: fixed; z-index: 40; width: 270px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 14px 16px; font-size: 14px; }
.readset h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 12px 0 6px; font-weight: 650; }
.readset h3:first-child { margin-top: 0; }
.readset .row { display: flex; align-items: center; gap: 8px; }
.readset .row b { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.readset .seg { display: flex; }
.readset .seg button { flex: 1; }
.resume { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 45; display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px); }
.resume button { background: transparent; color: inherit; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); }
.resume button:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }
.chap .t small .rd { color: var(--st-ueberarbeitet); }
.card form { margin-top: 8px; }
textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 9px; padding: 8px 10px; resize: vertical; min-height: 64px; font-size: 14px; line-height: 1.45; }
.formrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.group-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650; margin: 8px 2px 0; }

/* composer */
.composer { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 13px; box-shadow: 0 0 0 3px var(--accent-soft); margin-bottom: 10px; }
.composer .q { margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--ink-2); font: italic 14px/1.5 var(--text-font);
  max-height: 6.2em; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 13px; cursor: pointer; }

<body>

</header>
<main id="app" class="wrap"><div class="loading">Lädt …</div></main>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------------- configuration ---------------- */
const CFG = { owner: "Txbiaz", repo: "fanfiction-story-skill", branch: "lektorat", statsBranch: "webnovel-stats" };
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
// Only a local test copy may talk to another API; the public page always uses GitHub.
const API = (LOCAL && new URLSearchParams(location.search).get("api")) || "https://api.github.com";
const STATES = {
  "eingereicht": "eingereicht", "in-arbeit": "wird gelesen", "kommentiert": "kommentiert",
  "ueberarbeitet": "überarbeitet", "erledigt": "erledigt",
};
const KINDS = ["Anmerkung", "Fehler", "Stil", "Logik", "Lob"];
const TOKEN_KEY = "lektorat.token";

/* ---------------- small helpers ---------------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const same = (a, b) => String(a || "").toLowerCase() === String(b || "").toLowerCase();
const num = key => parseInt(key.slice(2), 10);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private window */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};
function decodeB64(s) {
  const bin = atob(String(s).replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function encodeB64(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function when(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const today = new Date();
  const hm = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === today.toDateString()) return `heute ${hm}`;
  return `${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })} ${hm}`;
}
function uid() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
let toastTimer;
function toast(msg, err = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), err ? 6000 : 2400);
}

/* ---------------- reading settings (per browser) ---------------- */
const READ_KEY = "lektorat.read";
const WIDTHS = [["schmal", "Schmal", 600], ["normal", "Normal", 690], ["breit", "Breit", 840]];
const READ = { size: 18.5, width: "normal", theme: "auto" };
try { Object.assign(READ, JSON.parse(store.get(READ_KEY) || "{}")); } catch { /* defaults */ }
function applyRead() {
  const root = document.documentElement;
  if (READ.size !== 18.5) root.style.setProperty("--read-size", `${READ.size}px`); else root.style.removeProperty("--read-size");
  root.style.setProperty("--read-width", `${(WIDTHS.find(w => w[0] === READ.width) || WIDTHS[1])[2]}px`);
  if (READ.theme === "auto") delete root.dataset.theme; else root.dataset.theme = READ.theme;
  store.set(READ_KEY, JSON.stringify(READ));
}
applyRead();
function openReadSettings() {
  const old = $(".readset");
  if (old) { old.remove(); return; }
  const btn = $("#readset"), r = btn.getBoundingClientRect();
  const box = document.createElement("div");
  box.className = "readset"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Leseeinstellungen");
  box.style.top = `${r.bottom + 8}px`;
  box.style.left = `${Math.max(16, Math.min(r.right - 270, document.documentElement.clientWidth - 286))}px`;
  const draw = () => {
    box.innerHTML = `<h3>Schriftgröße</h3>
      <div class="row"><button class="btn small" data-size="-1" aria-label="Kleiner">A−</button><b>${nf1.format(READ.size)} px</b>
        <button class="btn small" data-size="1" aria-label="Größer">A+</button>
        ${READ.size !== 18.5 ? `<button class="btn ghost small" data-size="0">Standard</button>` : ""}</div>
      <h3>Zeilenbreite</h3>
      <div class="seg">${WIDTHS.map(([k, l]) => `<button data-width="${k}" class="${READ.width === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <h3>Darstellung</h3>
      <div class="seg">${[["auto", "Wie System"], ["light", "Hell"], ["dark", "Dunkel"]].map(([k, l]) =>
        `<button data-theme-set="${k}" class="${READ.theme === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  };
  draw();
  box.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.size != null) READ.size = b.dataset.size === "0" ? 18.5 : Math.min(26, Math.max(14, READ.size + Number(b.dataset.size)));
    if (b.dataset.width) READ.width = b.dataset.width;
    if (b.dataset.themeSet) READ.theme = b.dataset.themeSet;
    applyRead(); draw();
    if (view?.type === "reader") drawComments();  // highlights and bubbles move with the text
    if (view?.type === "stats" && $("#chart")) drawPeriod();
  });
  document.body.appendChild(box);
  const close = e => { if (!box.contains(e.target) && e.target !== btn) { box.remove(); document.removeEventListener("pointerdown", close); } };
  setTimeout(() => document.addEventListener("pointerdown", close), 0);
}
$("#readset").addEventListener("click", openReadSettings);

/* ---------------- reading position (per browser and chapter) ---------------- */
const posKey = (story, key) => `lektorat.pos.${story}/${key}`;
function readPos(story, key) { try { return JSON.parse(store.get(posKey(story, key)) || "null"); } catch { return null; } }
let posTimer;
window.addEventListener("scroll", () => {
  if (view?.type !== "reader" || !view.blocks) return;
  clearTimeout(posTimer);
  posTimer = setTimeout(() => {
    if (view?.type !== "reader") return;
    const top = 70;
    const el = $$("#text [data-p]").find(b => b.getBoundingClientRect().bottom > top);
    if (!el) return;
    const max = document.documentElement.scrollHeight - innerHeight;
    const pct = max > 0 ? Math.min(1, scrollY / max) : 1;
    const old = readPos(view.story, view.key);
    const furthest = old && old.v === view.v ? Math.max(pct, old.max || 0) : pct;  // a new version starts over
    store.set(posKey(view.story, view.key), JSON.stringify({ p: +el.dataset.p, v: view.v,
      pct: Math.round(pct * 100) / 100, max: Math.round(furthest * 100) / 100, at: Date.now() }));
  }, 400);
}, { passive: true });
function restorePosition(story, key) {
  const pos = readPos(story, key);
  $(".resume")?.remove();
  if (!pos || pos.p < 3 || pos.pct >= 0.97) return;  // near the start or finished: begin at the top
  const el = $(`#text [data-p="${Math.min(pos.p, (view.blocks || []).length - 1)}"]`);
  if (!el) return;
  window.scrollTo(0, el.getBoundingClientRect().top + scrollY - 80);
  const bar = document.createElement("div");
  bar.className = "resume";
  bar.innerHTML = `<span>Weiter bei Absatz ${pos.p + 1}${pos.v !== view.v ? ` (gelesen in v${pos.v})` : ""}</span><button class="btn small">Zum Anfang</button>`;
  bar.querySelector("button").addEventListener("click", () => { window.scrollTo(0, 0); bar.remove(); });
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 7000);
}
function progressText(story, key) {
  const pos = readPos(story, key);
  if (!pos) return "";
  const m = pos.max ?? pos.pct;
  return m >= 0.97 ? ` · <span class="rd">gelesen ✓</span>` : m >= 0.05 ? ` · <span class="rd">${Math.round(m * 100)} % gelesen</span>` : "";
}

/* ---------------- GitHub API ---------------- */
let TOKEN = store.get(TOKEN_KEY);
async function gh(path, opts = {}) {
  const r = await fetch(API + path, {
    cache: "no-store", ...opts,
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json", ...(opts.headers || {}) },
  });
  if (!r.ok) {
    let msg = `${r.status}`;
    try { msg += " " + ((await r.json()).message || ""); } catch { /* no body */ }
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
const repoPath = `/repos/${CFG.owner}/${CFG.repo}`;
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const blobCache = new Map();
async function blob(sha) {
  if (!blobCache.has(sha)) blobCache.set(sha, gh(`${repoPath}/git/blobs/${sha}`).then(b => decodeB64(b.content)));
  return blobCache.get(sha);
}
async function readFile(path, ref = CFG.branch) {
  const r = await gh(`${repoPath}/contents/${encPath(path)}?ref=${encodeURIComponent(ref)}`);
  return { text: decodeB64(r.content), sha: r.sha };
}
/** Read a JSON file, change it with fn, write it back; start over if someone saved in between. */
async function mutateJson(path, fn, message) {
  for (let attempt = 0; attempt < 5; attempt++) {
    let cur = null, sha;
    try { const f = await readFile(path); cur = JSON.parse(f.text); sha = f.sha; }
    catch (e) { if (e.status !== 404) throw e; }
    const next = fn(cur);
    const body = { message, content: encodeB64(JSON.stringify(next, null, 1) + "\n"), branch: CFG.branch };
    if (sha) body.sha = sha;
    try {
      const r = await gh(`${repoPath}/contents/${encPath(path)}`, { method: "PUT", body: JSON.stringify(body) });
      S.files.set(path, r.content.sha);
      return next;
    } catch (e) {
      if (e.status === 409 || e.status === 422) { await sleep(300 + 400 * attempt); continue; }
      throw e;
    }
  }
  throw new Error("Jemand speichert gerade gleichzeitig. Bitte gleich noch einmal versuchen.");
}

/* ---------------- state ---------------- */
const S = { user: null, files: new Map(), stories: {}, loadedAt: 0, busy: false };

async function loadAll() {
  const tree = await gh(`${repoPath}/git/trees/${encodeURIComponent(CFG.branch)}?recursive=1`);
  S.files = new Map(tree.tree.filter(x => x.type === "blob").map(x => [x.path, x.sha]));
  const ids = [...S.files.keys()].filter(p => /^[^/]+\/index\.json$/.test(p)).map(p => p.split("/")[0]);
  const stories = {};
  await Promise.all(ids.map(async id => {
    const index = JSON.parse(await blob(S.files.get(`${id}/index.json`)));
    const comments = {};
    await Promise.all(Object.keys(index.chapters || {}).map(async key => {
      const sha = S.files.get(`${id}/${key}/comments.json`);
      comments[key] = sha ? (JSON.parse(await blob(sha)).comments || []) : [];
    }));
    let wn = null;  // written hourly by the stats run: which chapters are online, which version they match
    if (index.webnovel_book_id) {
      try { wn = JSON.parse((await readFile(`lektorat/${id}.json`, CFG.statsBranch)).text); }
      catch { wn = null; }
      if (wn && String(wn.book_id) !== String(index.webnovel_book_id)) wn = null;  // link changed since
    }
    stories[id] = { id, index, comments, wn };
  }));
  S.stories = stories;
  S.loadedAt = Date.now();
}
function chaptersOf(st) {
  return Object.entries(st.index.chapters || {}).sort((a, b) => num(a[0]) - num(b[0]));
}
const lastVersion = ch => (ch.versions || [])[ch.versions.length - 1] || {};
const openOf = list => (list || []).filter(c => (c.status || "offen") === "offen");
function webnovelInfo(st, key) {
  if (!st.wn || (parseInt(st.wn.offset, 10) || 0) !== (parseInt(st.index.webnovel_offset, 10) || 0)) return null;
  return (st.wn.chapters || {})[key] || false;
}
function wnBadge(st, key) {
  const w = webnovelInfo(st, key);
  if (w === null) return st.index.webnovel_book_id
    ? `<span class="wn" title="Wird beim nächsten stündlichen Abgleich geprüft">wird geprüft</span>` : `<span class="wn"></span>`;
  if (w === false) return `<span class="wn">nicht online</span>`;
  const latest = lastVersion(st.index.chapters[key]).v;
  if (w.same_as && w.same_as === latest) return `<span class="wn same" title="Auf WebNovel steht genau Version ${latest}">online · v${latest} ✓</span>`;
  if (w.same_as) return `<span class="wn old" title="Auf WebNovel steht Version ${w.same_as}, neuer ist v${latest}">online · v${w.same_as}, neu v${latest}</span>`;
  if (w.similarity != null) return `<span class="wn diff" title="Keine Version stimmt genau; am nächsten ist v${w.closest}">weicht ab · ${Math.round(w.similarity * 100)} %</span>`;
  return `<span class="wn same">online</span>`;
}
function wnSentence(st, key, v) {
  const w = webnovelInfo(st, key);
  if (!w) return "";
  const latest = lastVersion(st.index.chapters[key]).v;
  const date = w.published ? ` seit ${new Date(w.published.replace("Z", ":00Z")).toLocaleDateString("de-DE")}` : "";
  let what = "Text noch nicht abgeglichen";
  if (w.same_as) what = w.same_as === latest ? `entspricht genau Version ${latest}, der neuesten` : `entspricht Version ${w.same_as}; Version ${latest} ist dort noch nicht eingespielt`;
  else if (w.similarity != null) what = `weicht von allen Versionen ab, am nächsten an Version ${w.closest} (${Math.round(w.similarity * 100)} % der Absätze gleich)`;
  const link = w.id ? ` · <a href="https://www.webnovel.com/book/${esc(st.index.webnovel_book_id)}/${esc(w.id)}" target="_blank" rel="noopener">öffnen</a>` : "";
  return `<div class="vnote">Auf WebNovel als Kapitel ${w.index}${date}: ${what}${link}</div>`;
}
const isAuthor = st => same(st.index.author, S.user?.login);

/* ---------------- login ---------------- */
function renderLogin(error = "") {
  $("#me").hidden = $("#reload").hidden = $("#logout").hidden = $("#tab-stat").hidden = true;
  const fine = "https://github.com/settings/personal-access-tokens/new";
  const classic = "https://github.com/settings/tokens/new?scopes=repo&description=Lektorat";
  $("#app").innerHTML = `
  <section class="login">
    <h1>Lektorat</h1>
    <p class="lead">Kapitel lesen, Stellen markieren, kommentieren. Die Texte liegen im privaten Repo auf GitHub;
      diese Seite zeigt sie erst nach der Anmeldung.</p>
    <form class="panel" id="loginform">
      <label for="tok">GitHub-Token</label>
      <input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_… oder ghp_…" required>
      <div class="row"><button class="btn primary" type="submit">Anmelden</button><span class="err">${esc(error)}</span></div>
      <p class="note">Der Token bleibt nur in diesem Browser gespeichert und geht ausschließlich an GitHub.</p>
    </form>
    <details ${error ? "open" : ""}>
      <summary>So bekommst du einen Token (einmalig, 2 Minuten)</summary>
      <ol>
        <li>Auf GitHub <a href="${fine}" target="_blank" rel="noopener">einen neuen Token anlegen</a>
          („Fine-grained token“). Name: <code>Lektorat</code>, Ablauf so lang wie möglich.</li>
        <li><b>Resource owner:</b> <code>${esc(CFG.owner)}</code>. <b>Repository access:</b> „Only select repositories“
          → <code>${esc(CFG.repo)}</code>.</li>
        <li><b>Permissions → Repository permissions → Contents:</b> „Read and write“. Sonst nichts.</li>
        <li>„Generate token“, kopieren, oben einfügen.</li>
      </ol>
      <p>Taucht das Repo bei dir nicht auf, weil es nicht dir gehört: stattdessen einen
        <a href="${classic}" target="_blank" rel="noopener">klassischen Token</a> mit Haken bei <code>repo</code> anlegen.
        Der gilt für alle deine Repos, also nur in deinem eigenen Browser verwenden.</p>
    </details>
  </section>`;
  $("#loginform").addEventListener("submit", async ev => {
    ev.preventDefault();
    TOKEN = $("#tok").value.trim();
    if (!TOKEN) return;
    await start(true);
  });
}
async function start(fromLogin = false) {
  if (!TOKEN) return renderLogin();
  $("#app").innerHTML = `<div class="loading">Lädt …</div>`;
  try {
    S.user = await gh("/user");

}

/* ---------------- markdown (blocks numbered like tools/lektorat.py paragraphs()) ---------------- */
function blocks(md) {
  return md.replace(/\r\n/g, "\n").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
}
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^_\w])_(?!\s)(.+?)_(?!\w)/g, "$1<em>$2</em>")
    .replace(/\n/g, "<br>");
}
function renderBlock(b, i, changed) {
  const cls = `b${changed ? " changed" : ""}`;
  if (/^(-{3,}|\*{3,}|_{3,})$/.test(b)) return `<hr class="${cls}" data-p="${i}">`;
  const h = b.match(/^(#{1,6})\s+(.*)$/s);
  if (h) return `<h2 class="${cls}" data-p="${i}">${inline(h[2])}</h2>`;
  if (b.startsWith(">")) return `<blockquote class="${cls}" data-p="${i}">${inline(b.replace(/^>\s?/gm, ""))}</blockquote>`;
  return `<p class="${cls}" data-p="${i}">${inline(b)}</p>`;

/* ---------------- text positions ---------------- */
function offsetIn(el, node, off) {

}
function rangeAt(el, start, end) {
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const r = document.createRange();
  let pos = 0, n, setStart = false;
  while ((n = walker.nextNode())) {
    const len = n.length;
    if (!setStart && start <= pos + len) { r.setStart(n, start - pos); setStart = true; }
    if (setStart && end <= pos + len) { r.setEnd(n, end - pos); return r; }
    pos += len;
  }
  return setStart ? (r.setEnd(el, el.childNodes.length), r) : null;
}

    const s = m.index, e = s + m[0].length;
    if (pos < e || e >= text.length) {
      const lead = m[0].length - m[0].trimStart().length;
      return [s + lead, s + m[0].trimEnd().length];
    }

}

  if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); return r && { node: r.startContainer, off: r.startOffset }; }

function setHighlight(name, ranges) {

/* ---------------- reader ---------------- */
async function renderReader(storyId, key, v, keep) {
  const st = S.stories[storyId];
  const ch = st.index.chapters[key];
  const versions = ch.versions || [];
  const current = lastVersion(ch).v;
  if (!v || !versions.some(x => x.v === v)) v = current;
  const ver = versions.find(x => x.v === v);
  const prevState = keep && view?.type === "reader" && view.story === storyId && view.key === key ? view : null;
  view = { type: "reader", story: storyId, key, v, tab: prevState?.tab || "offen", active: prevState?.active || null,
    pick: null, showChanges: prevState?.showChanges ?? true };
  if (!prevState) $("#app").innerHTML = `<div class="loading">Kapitel lädt …</div>`;
  let text, prev = null;
  try {
    const sha = S.files.get(`${storyId}/${key}/v${v}.md`);
    if (!sha) throw new Error(`v${v}.md fehlt im Repo`);
    text = await blob(sha);
    const pv = versions.filter(x => x.v < v).pop();
    if (pv && S.files.get(`${storyId}/${key}/v${pv.v}.md`)) prev = await blob(S.files.get(`${storyId}/${key}/v${pv.v}.md`));
  } catch (e) {
    $("#app").innerHTML = `<div class="loading">Kapitel konnte nicht geladen werden: ${esc(e.message)}</div>`;
    return;
  }
  if (view.story !== storyId || view.key !== key || view.v !== v) return; // navigated away meanwhile
  const bl = blocks(text);
  const prevSet = prev ? new Set(blocks(prev)) : null;
  view.blocks = bl;
  const author = isAuthor(st);
  const scroll = prevState ? window.scrollY : 0;
  $("#app").innerHTML = `
  <div class="reader">
    <article>
      <div class="rhead">
        <a class="back" href="#/${encodeURIComponent(storyId)}">← ${esc(st.index.title || storyId)}</a>
        <h1>${esc(ver.title || key)}</h1>
        <div class="rmeta">
          ${pill(ch.state)}
          <select id="ver" aria-label="Version">${versions.slice().reverse().map(x =>
            `<option value="${x.v}" ${x.v === v ? "selected" : ""}>Version ${x.v}${x.v === current ? " (neu)" : ""} · ${esc((x.date || "").slice(0, 10).split("-").reverse().join("."))}</option>`).join("")}</select>
          <span>${ver.words || "?"} Wörter · von ${esc(ver.by || st.index.author || "?")}</span>
          ${prev ? `<label class="check" style="margin:0"><input type="checkbox" id="chg" ${view.showChanges ? "checked" : ""}> Änderungen zu v${versions.filter(x => x.v < v).pop().v} markieren</label>` : ""}
        </div>
        ${wnSentence(st, key, v)}
        ${ver.note ? `<div class="vnote">${esc(ver.note)}</div>` : ""}
        ${ch.note ? `<div class="vnote">${esc(ch.note)}</div>` : ""}
        <div class="ractions">${stateButtons(author, ch.state)}</div>
        <p class="hint">Satz anklicken oder Text markieren, dann „Kommentieren“.</p>
      </div>
      <div class="text" id="text">${bl.map((b, i) => renderBlock(b, i, prevSet && view.showChanges && !prevSet.has(b))).join("")}</div>
    </article>
    <aside class="side" id="side">
      <div class="side-head"><h2>Kommentare</h2>
        <div class="tabs" role="tablist"><button data-tab="offen">Offen</button><button data-tab="alle">Alle</button></div>
        <button class="btn ghost small side-close" id="sideclose" aria-label="Schließen">✕</button></div>
      <div class="cards" id="cards"></div>
    </aside>
  </div>
  <button class="btn primary mobile-fab" id="mfab">${commentIcon()}<span id="mfabn"></span></button>
  <button class="btn primary fab" id="fab" hidden>Kommentieren</button>`;
  window.scrollTo(0, scroll);
  if (!prevState) restorePosition(storyId, key);

}
function stateButtons(author, state) {
  const b = (s, label, primary) => state === s ? "" : `<button class="btn small ${primary ? "primary" : ""}" data-state="${s}">${label}</button>`;
  if (author) return b("erledigt", "Kapitel ist fertig", true) + (state === "erledigt" ? b("ueberarbeitet", "Wieder öffnen") : "");
  return (["eingereicht", "ueberarbeitet"].includes(state) ? b("in-arbeit", "Ich lese gerade") : "")
    + b("kommentiert", "Fertig gelesen", true);
}
function wireReader(st, key, v, author) {
  $("#ver").addEventListener("change", e => { location.hash = `#/${encodeURIComponent(st.id)}/${key}/v${e.target.value}`; });
  $("#chg")?.addEventListener("change", e => { view.showChanges = e.target.checked; renderReader(st.id, key, v, true); });
  $$(".ractions [data-state]").forEach(btn => btn.addEventListener("click", () => setState(st, key, btn.dataset.state)));
  $$(".tabs button").forEach(b => b.addEventListener("click", () => { view.tab = b.dataset.tab; drawComments(); }));
  $("#mfab").addEventListener("click", () => $("#side").classList.add("open"));
  $("#sideclose").addEventListener("click", () => $("#side").classList.remove("open"));
  const textEl = $("#text");
  let down = null;
  textEl.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  textEl.addEventListener("click", e => {
    const bub = e.target.closest(".bubble");
    if (bub) { const c = visibleComments().find(c => c.anchor?.p === +bub.dataset.bp); if (c) focusComment(c.id, false); return; }
    const sel = getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim()) { pickFromSelection(sel); return; }
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
    const blockEl = e.target.closest("[data-p]");
    if (!blockEl || blockEl.tagName === "HR") return;
    const caret = caretAt(e.clientX, e.clientY);
    if (!caret || !blockEl.contains(caret.node)) return;
    const pos = offsetIn(blockEl, caret.node, caret.off);
    const p = +blockEl.dataset.p;
    const hit = visibleComments().find(c => c.anchor && c.anchor.p === p && pos >= c.anchor.s && pos <= c.anchor.e);
    if (hit) { focusComment(hit.id, false); return; }

function pickFromSelection(sel) {

  if (!startEl || !$("#text").contains(startEl) || startEl.tagName === "HR") return;
  const p = +startEl.dataset.p;
  const s = offsetIn(startEl, range.startContainer, range.startOffset);
  let e = startEl.contains(range.endContainer) ? offsetIn(startEl, range.endContainer, range.endOffset) : startEl.textContent.length;
  const plain = startEl.textContent;

/* ---------------- comments in the reader ---------------- */
function anchorFor(c) {
  const bl = view.blocks;
  const tryBlock = i => {
    const el = $(`#text [data-p="${i}"]`);
    if (!el || !c.quote) return null;
    const idx = el.textContent.indexOf(c.quote);
    return idx < 0 ? null : { p: i, s: idx, e: idx + c.quote.length };
  };
  if (c.v === view.v && Number.isInteger(c.para)) {
    const a = tryBlock(c.para);
    if (a) return a;
    if (!c.quote && c.para < bl.length) return { p: c.para, s: 0, e: 0 };
  }
  for (let i = 0; i < bl.length; i++) { const a = tryBlock(i); if (a) return a; }
  return null;
}
function visibleComments() {
  const st = S.stories[view.story];
  const all = (st.comments[view.key] || []).map(c => ({ ...c, status: c.status || "offen" }));
  const list = all.filter(c => (c.v || 0) <= view.v && (view.tab === "alle" || c.status === "offen"));
  for (const c of list) c.anchor = anchorFor(c);

    || (a.anchor?.s || 0) - (b.anchor?.s || 0) || (a.at || "").localeCompare(b.at || ""));
}

/** Word-level diff of a quote and its suggested replacement. */
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  if (!a || n * m > 250000) return `${a ? `<del>${esc(a)}</del><br>` : ""}<ins>${esc(b)}</ins>`;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out += `<del>${esc(A[i++])}</del>`;
    else out += `<ins>${esc(B[j++])}</ins>`;
  }
  while (i < n) out += `<del>${esc(A[i++])}</del>`;
  while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}

async function ghRaw(path) {
  const r = await fetch(API + path, { cache: "no-store",
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github.raw+json" } });
  if (!r.ok) { const e = new Error(String(r.status)); e.status = r.status; throw e; }

    const c = l.split(","), o = {};
    head.forEach((h, i) => { o[h] = c[i] ?? ""; });
    o.t = Date.parse(o.time_utc);
    return o;
  }).filter(o => !isNaN(o.t)).sort((a, b) => a.t - b.t);
}

      return { id, name: meta.name || id, author: meta.author || "", chapters: meta.chapters || [], rows, slots: {} };
    }));
    ST.books = books.filter(b => b.rows.length).sort((a, b) => a.name.localeCompare(b.name));
    ST.loadedAt = Date.now();
  })();
  try { await ST.loading; } finally { ST.loading = null; }
}
const storyOf = book => Object.values(S.stories).find(st => String(st.index.webnovel_book_id) === book.id);

/* time helpers (local time of the viewer) */
const hourStart = t => { const d = new Date(t); d.setMinutes(0, 0, 0); return d.getTime(); };
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const weekStart = t => addDays(dayStart(t), -((new Date(t).getDay() + 6) % 7));
const monthStart = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const addMonths = (t, n) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth() + n, 1).getTime(); };
function isoWeek(t) {
  const d = new Date(dayStart(t)); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / DAY - 3 + ((w1.getDay() + 6) % 7)) / 7);
}

/** Gain per clock hour: Map(hourStart -> {gain, est}). */
function hourSlots(book, metric) {
  if (book.slots[metric.key]) return book.slots[metric.key];
  const last = new Map();
  for (const r of book.rows) {
    const v = r[metric.key];
    if (v === "" || v == null || !isFinite(Number(v))) continue;
    last.set(hourStart(r.t), Number(v));
  }
  const keys = [...last.keys()].sort((a, b) => a - b);
  const slots = new Map();
  for (let i = 1; i < keys.length; i++) {
    const a = keys[i - 1], b = keys[i];
    const span = Math.round((b - a) / HOUR);
    if (span < 1) continue;
    let delta = last.get(b) - last.get(a);
    if (metric.reset && delta < 0) delta = last.get(b);  // new WebNovel week
    for (let k = 0; k < span; k++) slots.set(a + k * HOUR, { gain: delta / span, est: span > 1 });
  }
  return (book.slots[metric.key] = { slots, first: keys[0], last: keys[keys.length - 1], value: last.get(keys[keys.length - 1]) });
}
function sumSlots(slots, from, to) {
  let s = 0, n = 0, e = 0;
  for (const [h, x] of slots) if (h >= from && h < to) { s += x.gain; n++; if (x.est) e++; }
  return { s, n, e, est: e > 0 };
}
function periodRange(period, anchor, info) {
  if (period === "tag") { const f = dayStart(anchor); return [f, addDays(f, 1)]; }
  if (period === "woche") { const f = weekStart(anchor); return [f, addDays(f, 7)]; }
  if (period === "monat") { const f = monthStart(anchor); return [f, addMonths(f, 1)]; }
  return [dayStart(info.first), addDays(dayStart(info.last), 1)];
}
function bucketList(period, from, to) {
  const out = [];
  if (period === "tag") {
    for (let h = from; h < to; h += HOUR) {
      const hr = new Date(h).getHours();
      out.push({ from: h, to: h + HOUR, label: String(hr), title: `${hr}–${hr + 1} Uhr` });
    }
  } else if (period === "woche" || period === "monat" || (period === "gesamt" && to - from <= 62 * DAY)) {
    for (let d = from; d < to; d = addDays(d, 1)) {
      const wd = WD[new Date(d).getDay()];
      out.push({ from: d, to: addDays(d, 1), day: true,
        label: period === "woche" ? wd.slice(0, 2) : period === "monat" ? String(new Date(d).getDate()) : dShort(d),
        title: `${wd}, ${dShort(d)}` });
    }
  } else {
    for (let m = monthStart(from); m < to; m = addMonths(m, 1)) {
      const name = new Date(m).toLocaleDateString("de-DE", { month: "short", year: "2-digit" });
      out.push({ from: m, to: addMonths(m, 1), month: true, label: name,
        title: new Date(m).toLocaleDateString("de-DE", { month: "long", year: "numeric" }) });
    }
  }
  return out;
}
function periodLabel(period, from, to, info) {
  if (period === "tag") return `${WD[new Date(from).getDay()]}, ${dLong(from)}`;
  if (period === "woche") return `KW ${isoWeek(from)} · ${dShort(from)}–${dLong(addDays(to, -1))}`;
  if (period === "monat") return new Date(from).toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  return `Seit ${dLong(info.first)}`;
}

function computePeriod(book, metric, period, anchor) {
  const info = hourSlots(book, metric);
  const [from, to] = periodRange(period, anchor, info);
  const covered = h => h >= info.first && h < info.last;  // slots exist for [first, last)
  const items = bucketList(period, from, to).map(b => {
    const lo = Math.max(b.from, info.first), hi = Math.min(b.to, info.last);
    if (b.from >= info.last || b.to <= info.first || hi <= lo) return { ...b, v: null, future: b.from >= info.last };
    const r = sumSlots(info.slots, b.from, b.to);
    const expected = Math.round((hi - lo) / HOUR);
    const estH = r.e + Math.max(0, expected - r.n);  // hours spread over a gap, or missing
    // an hour is estimated or not; a day or month only counts as estimated when most of it was
    const est = b.day || b.month ? estH > expected / 2 : estH > 0;
    return { ...b, v: r.n ? r.s : null, est, estH: b.day || b.month ? estH : 0, partial: b.to > info.last };
  });
  const total = sumSlots(info.slots, from, to);
  // compare with the period before, up to the same point if this one is still running
  let prev = null;
  if (period !== "gesamt") {
    const [pf] = periodRange(period, period === "tag" ? addDays(from, -1) : period === "woche" ? addDays(from, -7) : addMonths(from, -1), info);
    const running = to > info.last;
    const pt = running ? pf + (info.last - from) : from;
    if (pf >= info.first || covered(pf)) {
      const p = sumSlots(info.slots, pf, pt);
      if (p.n) prev = { s: p.s, running, until: pt };
    }
  }
  const hours = Math.max(1, Math.round((Math.min(to, info.last) - Math.max(from, info.first)) / HOUR));
  return { info, from, to, items, total, prev, hours };
}

/* ---------------- statistics view ---------------- */
async function renderStats(bookId) {
  view = { type: "stats" };
  if (!ST.books) $("#app").innerHTML = `<div class="loading">Statistik lädt …</div>`;
  try { await loadStats(); }
  catch (e) { $("#app").innerHTML = `<div class="loading">Statistik konnte nicht geladen werden: ${esc(e.message)}</div>`; return; }
  if (view?.type !== "stats") return;
  if (!ST.books.length) {
    $("#app").innerHTML = `<div class="page"><h1>Statistik</h1><div class="empty">Noch keine Daten. Werke kommen dazu, sobald sie
      auf der Lektorat-Seite einen WebNovel-Link haben oder in <code>tools/webnovel/books.json</code> stehen.</div></div>`;
    return;
  }
  if (bookId && ST.books.some(b => b.id === bookId)) SV.book = bookId;
  if (!ST.books.some(b => b.id === SV.book)) SV.book = ST.books[0].id;
  if (!METRICS.some(m => m.key === SV.metric)) SV.metric = "views";
  saveSV();
  const book = ST.books.find(b => b.id === SV.book);
  const lastRow = book.rows[book.rows.length - 1];
  const age = Date.now() - lastRow.t;
  const story = storyOf(book);
  const tabs = ST.books.length > 1 ? `<nav class="worktabs" aria-label="Werke">${ST.books.map(b =>
    `<a class="wtab ${b.id === book.id ? "on" : ""}" href="#/statistik/${esc(b.id)}">${esc(b.name)}</a>`).join("")}</nav>` : "";
  $("#app").innerHTML = `
  <div class="page stats">
    <h1>Statistik</h1>
    <p class="sub">Von WebNovel, stündlich, solange der PC läuft. Letzte Messung: ${esc(when(new Date(lastRow.t).toISOString()))}${age > 2 * HOUR
      ? ` <span class="warn">(vor ${Math.round(age / HOUR)} Std.: der PC war wohl aus)</span>` : ""}.</p>
    ${tabs}
    <div class="story-head"><h3>${esc(book.name)}</h3>
      <span class="meta">${esc(book.author)}${book.chapters.length ? ` · ${book.chapters.length} Kapitel` : ""} · gemessen seit ${dLong(book.rows[0].t)}</span>
      <span class="tools">${story ? `<a href="#/${encodeURIComponent(story.id)}">Im Lektorat</a>` : ""}
        <a href="https://www.webnovel.com/book/${esc(book.id)}" target="_blank" rel="noopener">WebNovel</a></span></div>
    <div class="tiles">${statTiles(book, lastRow)}</div>
    <section class="panel chartpanel">
      <div class="ctrl">
        <div class="seg" role="tablist" aria-label="Wert">${METRICS.map(m =>
          `<button role="tab" data-metric="${m.key}" class="${m.key === SV.metric ? "on" : ""}" aria-selected="${m.key === SV.metric}">${m.label}</button>`).join("")}</div>
        <div class="seg" role="tablist" aria-label="Zeitraum">${PERIODS.map(([k, l]) =>
          `<button role="tab" data-period="${k}" class="${k === SV.period ? "on" : ""}" aria-selected="${k === SV.period}">${l}</button>`).join("")}</div>
      </div>
      <div id="periodbox"></div>
    </section>
  </div>`;
  $$("[data-metric]").forEach(b => b.addEventListener("click", () => { SV.metric = b.dataset.metric; saveSV(); renderStats(); }));
  $$("[data-period]").forEach(b => b.addEventListener("click", () => { SV.period = b.dataset.period; SV.anchor = null; saveSV(); renderStats(); }));
  drawPeriod();
}
function statTiles(book, lastRow) {
  const tile = (label, value, sub, cls = "") => `<div class="tile"><span class="tl">${label}</span><b>${value}</b><small class="${cls}">${sub}</small></div>`;
  const day = key => {
    const m = METRICS.find(x => x.key === key), info = hourSlots(book, m);
    if (info.value == null) return { v: null, g: null };
    const g = sumSlots(info.slots, info.last - 24 * HOUR, info.last);
    return { v: info.value, g: g.n ? g.s : null };
  };
  const gsub = g => g == null ? "noch kein Vergleich" : `${signed(g)} in 24 Std.`;
  const gcls = g => g > 0 ? "good" : g < 0 ? "bad" : "";
  const out = [];
  for (const [key, label] of [["views", "Views"], ["collections", "Collections"], ["power_stones_week", "Power Stones (Woche)"], ["comments", "Kommentare"]]) {
    const d = day(key);
    if (d.v != null) out.push(tile(label, fmtGain(d.v), gsub(d.g), gcls(d.g)));
  }
  const rank = lastRow.power_rank, wrank = lastRow.power_rank_week;
  out.push(tile("Power-Rang", rank ? `#${nf.format(rank)}` : "–", wrank ? `Woche: #${wrank} der Fanfics` : "Woche: nicht in den Top 200"));
  out.push(tile("Bewertungen", nf.format(Number(lastRow.ratings) || 0), `Score ${lastRow.score || "–"} · ${lastRow.chapters || "?"} Kapitel`));
  return out.join("");
}
function drawPeriod() {
  const book = ST.books.find(b => b.id === SV.book);
  const metric = METRICS.find(m => m.key === SV.metric);
  const info = hourSlots(book, metric);
  const box = $("#periodbox");
  if (info.value == null || info.first === info.last) {
    box.innerHTML = `<div class="empty">Für ${metric.label} gibt es noch keine zwei Messungen.</div>`;
    return;
  }
  const anchor = SV.anchor ?? info.last;
  const P = computePeriod(book, metric, SV.period, anchor);
  const unit = SV.period === "tag" ? "Stunde" : P.items[0]?.month ? "Monat" : "Tag";
  const avgN = SV.period === "tag" ? P.hours : P.items.filter(i => i.v != null).length || 1;
  const prevTxt = P.prev ? (() => {
    const pct = P.prev.s ? Math.round((P.total.s - P.prev.s) / Math.abs(P.prev.s) * 100) : null;
    const what = { tag: "gestern", woche: "letzte Woche", monat: "letzter Monat" }[SV.period];
    const until = P.prev.running ? ` bis ${SV.period === "tag" ? new Date(P.prev.until).getHours() + " Uhr" : WD[new Date(P.prev.until).getDay()].slice(0, 2) + " " + new Date(P.prev.until).getHours() + " Uhr"}` : "";
    return `${what}${until}: ${signed(P.prev.s)}${pct == null ? "" : ` · <span class="${pct > 0 ? "good" : pct < 0 ? "bad" : ""}">${pct > 0 ? "▲" : pct < 0 ? "▼" : ""} ${pct > 0 ? "+" : ""}${pct} %</span>`}`;
  })() : "";
  const canPrev = SV.period !== "gesamt" && P.from > dayStart(info.first);
  const canNext = SV.period !== "gesamt" && P.to <= info.last;
  box.innerHTML = `
    <div class="pnav">
      <button class="btn ghost small arrow" id="pprev" ${canPrev ? "" : "disabled"} ${SV.period === "gesamt" ? "hidden" : ""} aria-label="Zurück">‹</button>
      <b>${periodLabel(SV.period, P.from, P.to, info)}</b>
      <button class="btn ghost small arrow" id="pnext" ${canNext ? "" : "disabled"} ${SV.period === "gesamt" ? "hidden" : ""} aria-label="Weiter">›</button>
      ${SV.anchor != null && SV.period !== "gesamt" ? `<button class="btn ghost small" id="pnow">Aktuell</button>` : ""}
    </div>
    <div class="kpi"><b>${signed(P.total.n ? P.total.s : null)}</b> <span>${metric.label}${P.to > info.last && SV.period !== "gesamt" ? " bisher" : ""}</span></div>
    <p class="kpisub">Ø ${signed(P.total.n ? P.total.s / avgN : null)} pro ${unit}${prevTxt ? ` · ${prevTxt}` : ""}${SV.period === "gesamt" ? ` · jetzt ${fmtGain(info.value)} insgesamt` : ""}</p>
    <div class="chart" id="chart" aria-hidden="false"></div>
    <p class="note">${metric.label} pro ${unit}. Helle Balken sind geschätzt: Der PC war ${SV.period === "tag" ? "in der Stunde" : "mehr als die Hälfte der Zeit"} aus, der Zuwachs ist gleichmäßig verteilt.
      ${SV.period === "gesamt" || SV.period === "monat" || SV.period === "woche" ? "Auf einen Balken klicken öffnet den Zeitraum darunter." : ""}
      ${metric.reset ? "Power Stones zählen je WebNovel-Woche (Start Montag 0 Uhr China-Zeit); der Rücksetzer zählt nicht als Verlust." : ""}
      ${metric.key === "comments" ? "Kommentare: Summe der Kapitel, die stündlich gezählt werden." : ""}</p>
    <details class="tbl"><summary>Als Tabelle</summary><table><thead><tr><th>${SV.period === "tag" ? "Stunde" : "Zeitraum"}</th><th>${metric.label}</th></tr></thead><tbody>
      ${P.items.filter(i => !i.future).map(i => `<tr><td>${esc(i.title)}</td><td>${i.v == null ? "keine Messung" : signed(i.v)}${i.est ? " (geschätzt)" : ""}</td></tr>`).join("")}
      <tr class="sum"><td>Summe</td><td>${signed(P.total.n ? P.total.s : null)}</td></tr></tbody></table></details>`;
  const move = dir => {
    const a = SV.anchor ?? info.last;
    SV.anchor = SV.period === "tag" ? addDays(a, dir) : SV.period === "woche" ? addDays(a, 7 * dir) : addMonths(monthStart(a), dir);
    if (SV.anchor > info.last) SV.anchor = null;
    drawPeriod();
  };
  $("#pprev").addEventListener("click", () => move(-1));
  $("#pnext").addEventListener("click", () => move(1));
  $("#pnow")?.addEventListener("click", () => { SV.anchor = null; drawPeriod(); });
  drawBars($("#chart"), P.items, metric, item => {
    if (item.month) { SV.period = "monat"; SV.anchor = item.from; }
    else if (item.day) { SV.period = "tag"; SV.anchor = item.from; }
    else return;
    saveSV(); renderStats();
  });
}
function niceStep(range, n) {
  const raw = range / n || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function drawBars(el, items, metric, onPick) {
  const W = Math.max(280, Math.round(el.clientWidth)), H = W < 520 ? 210 : 260;
  const P = { l: 52, r: 8, t: 12, b: 26 };
  const vals = items.filter(i => i.v != null).map(i => i.v);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if (max === min) max = min + 1;
  const step = niceStep(max - min, 4);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = v => P.t + (max - v) / (max - min) * (H - P.t - P.b);
  const cw = (W - P.l - P.r) / items.length, bw = Math.max(2, Math.min(32, cw * 0.7));
  const every = Math.max(1, Math.ceil(items.length / Math.max(1, Math.floor((W - P.l) / 30))));
  let svg = "";
  for (let v = min; v <= max + step / 2; v += step) {
    const yy = y(v).toFixed(1);
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" class="${Math.abs(v) < step / 2 ? "zero" : "grid"}"/>`
      + `<text x="${P.l - 6}" y="${yy}" dy="0.32em" text-anchor="end" class="ax">${esc(fmtAxis(Math.round(v * 100) / 100))}</text>`;
  }
  items.forEach((it, i) => {
    const x = P.l + i * cw + (cw - bw) / 2, cx = P.l + i * cw + cw / 2;
    if (i % every === 0) svg += `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" class="ax">${esc(it.label)}</text>`;
    if (it.v == null || it.v === 0) return;
    const y0 = y(0), yv = y(it.v), h = Math.abs(y0 - yv), r = Math.min(4, bw / 2, h);
    const top = Math.min(y0, yv), bottom = Math.max(y0, yv);
    const d = it.v > 0
      ? `M${x},${bottom}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${bottom}Z`
      : `M${x},${top}V${bottom - r}Q${x},${bottom} ${x + r},${bottom}H${x + bw - r}Q${x + bw},${bottom} ${x + bw},${bottom - r}V${top}Z`;
    svg += `<path d="${d}" class="col${it.est ? " est" : ""}" data-i="${i}"/>`;
  });
  items.forEach((it, i) => {
    if (!it.future) svg += `<rect class="hit" data-i="${i}" x="${(P.l + i * cw).toFixed(1)}" y="${P.t}" width="${cw.toFixed(1)}" height="${H - P.t - P.b}"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(metric.label)} als Balkendiagramm">${svg}</svg><div class="tip" hidden></div>`;
  const tip = $(".tip", el);
  const show = (i, ev) => {
    const it = items[i];
    $$(".col", el).forEach(b => b.classList.toggle("on", b.dataset.i === String(i)));
    tip.innerHTML = `<b>${esc(it.title)}</b><span>${it.v == null ? "keine Messung" : `${signed(it.v)} ${esc(metric.label)}`}</span>${it.est && !it.estH ? "<small>geschätzt (PC aus)</small>" : ""}${it.estH ? `<small>davon ${it.estH} Std. geschätzt (PC aus)</small>` : ""}${it.partial ? "<small>läuft noch</small>" : ""}`;
    tip.hidden = false;
    const box = el.getBoundingClientRect();
    const x = Math.min(Math.max(ev.clientX - box.left, 70), box.width - 70);
    tip.style.left = `${x}px`; tip.style.top = `${Math.max(0, ev.clientY - box.top - 64)}px`;
  };
  $$(".hit", el).forEach(h => {
    h.addEventListener("pointermove", ev => show(+h.dataset.i, ev));
    h.addEventListener("pointerleave", () => { tip.hidden = true; $$(".col.on", el).forEach(b => b.classList.remove("on")); });
    h.addEventListener("click", () => { const it = items[+h.dataset.i]; if (it.v != null && onPick) onPick(it); });
  });
}
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (view?.type === "stats" && $("#chart")) drawPeriod(); }, 150);
});

start();
